<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RIG-Puppy Wiki</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="RIG-Puppy Smart Robot Dog Documentation">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple.css">
  <style>
    :root {
      --theme-color: #42b983;
      --sidebar-width: 280px;
    }
    .sidebar-nav > ul > li > a {
      font-weight: bold;
      font-size: 15px;
    }
    .sidebar-nav ul ul li a {
      font-size: 13px;
    }
    .markdown-section {
      max-width: 900px;
    }
    .markdown-section table {
      display: table;
      width: 100%;
    }
    .markdown-section pre {
      background-color: #f6f8fa;
      border-radius: 6px;
    }
    .markdown-section code {
      background-color: #f0f0f0;
      padding: 2px 6px;
      border-radius: 3px;
    }
    /* Mermaid 图表优化 */
    .mermaid {
      text-align: center;
      margin: 20px 0;
    }
    /* 引用样式 */
    cite {
      display: block;
      background: #f6f8fa;
      border-left: 4px solid #42b983;
      padding: 10px 15px;
      margin: 10px 0;
      font-size: 12px;
      color: #666;
    }
    cite strong {
      color: #333;
    }
  </style>
</head>
<body>
  <div id="app">Loading...</div>
  <script>
    window.$docsify = {
      name: 'RIG-Puppy Wiki',
      repo: '',
      loadSidebar: true,
      subMaxLevel: 3,
      basePath: '/content/',
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md'
      },
      search: {
        placeholder: 'Search',
        noData: 'No results found',
        depth: 4,
        paths: 'auto'
      },
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied!'
      },
      pagination: {
        previousText: 'Previous',
        nextText: 'Next',
      },
      auto2top: true,
      homepage: 'Project Overview/Project Overview.md',
      markdown: {
        renderer: {
          // 处理 mermaid 代码块
          code: function(code, lang) {
            if (lang === 'mermaid') {
              return '<div class="mermaid">' + code + '</div>';
            }
            return this.origin.code.apply(this, arguments);
          }
        }
      }
    }
  </script>
  <!-- Docsify 核心 -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <!-- 搜索插件 -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <!-- 代码复制 -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <!-- 代码高亮 -->
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-c.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-cpp.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <!-- Mermaid 图表 -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script>
    mermaid.initialize({ startOnLoad: false });
    window.$docsify.plugins = [].concat(function(hook) {
      hook.afterEach(function(html) {
        return html;
      });
      hook.doneEach(function() {
        mermaid.init(undefined, '.mermaid');
      });
    }, window.$docsify.plugins || []);
  </script>
  <!-- 分页 -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
</body>
</html>
